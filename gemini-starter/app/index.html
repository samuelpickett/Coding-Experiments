<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Syllabus Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; }
        button { background: #007BFF; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; background: #f4f4f4; border-left: 5px solid #007BFF; min-height: 50px; }
    </style>
</head>
<body>
    <h2>📚 Custom Syllabus Chatbot</h2>
    <textarea id="question" placeholder="Ask a question about the syllabus..."></textarea>
    <button onclick="sendQuery()">Ask AI</button>
    
    <h3>Response:</h3>
    <div id="output">AI responses will appear here...</div>

    <script>
        async function sendQuery() {
            const questionText = document.getElementById('question').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerText = "Thinking...";

            try {
                // Send the question to our local FastAPI backend
                const response = await fetch('http://127.0.0.1:8000/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: questionText })
                });
                const data = await response.json();
                console.log(data.response);
                outputDiv.innerText = data.response;
            } catch (error) {
                outputDiv.innerText = "Error connecting to backend server.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
